name: Python compatibility

on:
  push:
    paths:
      - "pyproject.toml"
      - "poetry.lock"
      - "model_package/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/python-compatibility.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "poetry.lock"
      - "model_package/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/python-compatibility.yml"

jobs:
  rl:
    name: RL Python ${{ matrix.python-version }} on macOS
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install matrix Python
        run: uv python install ${{ matrix.python-version }}
      - uses: snok/install-poetry@v1
      - name: Install locked dependencies
        run: |
          poetry env use "$(uv python find ${{ matrix.python-version }})"
          poetry sync --no-interaction
      - name: Test model package compatibility
        run: poetry run python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
