name: Python compatibility

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "model_package/**"
      - "pacbot_rs/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/python-compatibility.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "model_package/**"
      - "pacbot_rs/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/python-compatibility.yml"

jobs:
  rl:
    name: RL Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-2025]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Cache the Rust build
        # Compiled dependencies, per OS and Python version (pyo3 builds for the Python it finds)
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: pacbot_rs -> target
          key: py${{ matrix.python-version }}
      - name: Check lockfile
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Build Rust extension
        # The README's command, exactly, so the two can't drift apart; warnings fail the build
        # (they apply to this crate only, not to its dependencies)
        run: uv run --project .. --directory pacbot_rs maturin develop --release
        env:
          RUSTFLAGS: -D warnings
      - name: Test model package compatibility
        run: uv run --locked python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
