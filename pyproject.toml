[tool.poetry]
name = "pacbot-rl"
version = "0.1.0"
description = "Reinforcement learning for the Harvard PacBot competition."
authors = ["Quinn Tucker <qxzcraft@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
pacbot-rl-models = { path = "model_package", develop = true }
python = ">=3.11,<3.15"
numpy = ">=2.1,<3"
torch = [
  { version = ">=2.9.1,<2.10", markers = "sys_platform == 'darwin'", source = "PyPI" },
  { version = ">=2.9.1,<2.10", markers = "sys_platform != 'darwin'", source = "torch-cuda" }
]
maturin = "^1.3.0"
matplotlib = "^3.8.0"
wandb = "^0.24.2"
setuptools = ">=77.0.3,<100"
black = "^23.9.1"
tqdm = "^4.66.1"
safetensors = "^0.8.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.25.2"


[[tool.poetry.source]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu128"
priority = "supplemental"


[[tool.poetry.source]]
name = "PyPI"
priority = "primary"


[tool.black]
line-length = 100


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
