[project]
name = "pacbot-rl"
version = "0.1.0"
description = "Reinforcement learning for the Harvard PacBot competition."
authors = [{ name = "Quinn Tucker", email = "qxzcraft@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pacbot-rl-models",
    "numpy>=2.1,<3",
    "torch>=2.9.1,<2.10",
    "maturin>=1.3,<2",
    "matplotlib>=3.8,<4",
    "wandb>=0.24.2,<0.25",
    "setuptools>=77.0.3,<100",
    "black>=23.9.1,<24",
    "tqdm>=4.66.1,<5",
    "safetensors>=0.8,<0.9",
]

[dependency-groups]
dev = ["ipykernel>=6.25.2,<7"]

[tool.uv]
package = false

[tool.uv.sources]
pacbot-rl-models = { path = "model_package" }
torch = [{ index = "torch-cuda", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.black]
line-length = 100
