[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pacbot-rl-models"
version = "0.1.0"
description = "Runtime neural network models for PacBot reinforcement learning."
authors = [{ name = "Quinn Tucker", email = "qxzcraft@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["torch>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pacbot_rl_models*"]
